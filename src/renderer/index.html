      <style>
      /* Theme tokens are set on :root at runtime by applyTheme(). */
      html, body { background: var(--fove-bg, #0b0b0f); }

      /* Panes settle into place rather than appearing abruptly. Transforms and
         opacity only, so nothing triggers layout while a terminal is drawing. */
      [data-pane] {
        animation: fove-pane-in 140ms ease-out;
        transition: outline-color 120ms ease-out;
      }
      @keyframes fove-pane-in {
        from { opacity: 0; transform: scale(0.985); }
        to   { opacity: 1; transform: scale(1); }
      }

      button { transition: background 100ms ease-out, border-color 100ms ease-out, color 100ms ease-out; }

      /* Overlays -- the diff and the model picker. */
      @keyframes fove-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fove-rise {
        from { opacity: 0; transform: translateY(6px) scale(0.99); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      /* Someone who has asked the OS for less motion gets none of it. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
